name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OMTS
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Buildifier
        run: |
          BUILDIFIER_URL="https://github.com/bazelbuild/buildtools/releases/latest/download/buildifier-linux-amd64"
          sudo curl -sSL "${BUILDIFIER_URL}" -o /usr/local/bin/buildifier
          sudo chmod +x /usr/local/bin/buildifier
          buildifier --version

      - name: Check Bazel Formatting (Buildifier)
        run: |
          echo "Checking Bazel file formatting..."
          buildifier --mode=check -r .

      - name: Check Bazel Linting (Buildifier)
        run: |
          echo "Checking Bazel file linting..."
          buildifier --lint=warn -r .

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Code Linting (Ruff)
        run: |
          echo "Checking Python code linting..."
          ruff check .

      - name: Check Python Code Formatting (Ruff)
        run: |
          echo "Checking Python code formatting..."
          ruff format --check .

  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout OMTS
        uses: actions/checkout@v7

      # Bazel fetches IOC plus the LLVM, CUDA, Rust and protobuf toolchains.
      # The default runner image does not leave enough room, so reclaim the
      # preinstalled SDKs this build does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /

      # intrinsic-ai/ioc-staging is private and the default GITHUB_TOKEN is
      # scoped to this repository only. IOC_STAGING_DEPLOY_KEY is the private
      # half of a read-only deploy key registered on ioc-staging, so the
      # credential is scoped to that one repository. Once ioc-staging is public
      # this step, the secret and the deploy key can all be deleted.
      - name: Configure access to ioc-staging
        env:
          IOC_STAGING_DEPLOY_KEY: ${{ secrets.IOC_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${IOC_STAGING_DEPLOY_KEY}" ]; then
            echo "::error::IOC_STAGING_DEPLOY_KEY secret is not configured."
            echo "It is the private half of the read-only deploy key on" \
              "intrinsic-ai/ioc-staging."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${IOC_STAGING_DEPLOY_KEY}" > ~/.ssh/ioc_staging
          chmod 600 ~/.ssh/ioc_staging
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Configured in ~/.ssh/config rather than core.sshCommand so that
          # git-lfs, which invokes ssh itself, also picks the key up.
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/ioc_staging"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
          # MODULE.bazel clones ioc-staging over https, but a deploy key only
          # authenticates over ssh. Rewrite just that one URL so the rest of
          # github.com, including actions/checkout's own credentials, is
          # untouched.
          git config --global \
            url."git@github.com:intrinsic-ai/ioc-staging.git".insteadOf \
            "https://github.com/intrinsic-ai/ioc-staging.git"
          # IOC keeps its binary assets in Git LFS. Bazel checks the repository
          # out with plain `git`, so the LFS smudge filter has to be installed
          # globally or the working tree ends up full of pointer files.
          git lfs install --skip-repo
          git lfs version

      # Downloaded archives only. Bazel does not put git_override clones in the
      # repository cache, so IOC is re-cloned on every run.
      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      # Compiled outputs. Without this the unit tests pay a full cold compile
      # of protobuf, gRPC and the IOC Python protos on every run.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      # Analysis catches the class of breakage this job exists for: stale @ioc
      # labels, missing dependencies and malformed BUILD files. It covers all
      # of //..., which a full compile cannot on a GitHub-hosted runner (ICON,
      # OpenCV, CUDA and the FoundationPose models do not fit).
      - name: Analyze all targets
        run: |
          bazel --output_user_root=~/.cache/bazel \
            build --nobuild \
            --repository_cache=~/.cache/bazel-repo \
            //...

      - name: Run unit tests
        run: |
          bazel --output_user_root=~/.cache/bazel \
            test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            //tests/...
