name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OMTS
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned rather than tracking `latest`: buildtools v10.0.0 (2026-09-14)
      # was published with no release assets at all, so
      # releases/latest/download/... started returning 404 and broke this job
      # on every branch. v8.5.1 is the newest release that ships binaries.
      #
      # curl needs --fail as well. Without it a 404 is written to the output
      # file like any other response, and the job fails later and confusingly
      # with "/usr/local/bin/buildifier: line 1: Not: command not found".
      - name: Install Buildifier
        run: |
          BUILDIFIER_VERSION="v8.5.1"
          BUILDIFIER_URL="https://github.com/bazelbuild/buildtools/releases/download/${BUILDIFIER_VERSION}/buildifier-linux-amd64"
          sudo curl -fsSL "${BUILDIFIER_URL}" -o /usr/local/bin/buildifier
          sudo chmod +x /usr/local/bin/buildifier
          buildifier --version

      - name: Check Bazel Formatting (Buildifier)
        run: |
          echo "Checking Bazel file formatting..."
          buildifier --mode=check -r .

      - name: Check Bazel Linting (Buildifier)
        run: |
          echo "Checking Bazel file linting..."
          buildifier --lint=warn -r .

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python Code Linting (Ruff)
        run: |
          echo "Checking Python code linting..."
          ruff check .

      - name: Check Python Code Formatting (Ruff)
        run: |
          echo "Checking Python code formatting..."
          ruff format --check .

  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    # A cold run (no disk cache) measured 1h10m: 1m30s to reclaim disk, 9m30s to
    # analyze //..., 59m to build and run //tests/.... 90 minutes left too
    # little headroom for a slow runner, so allow 120.
    timeout-minutes: 120
    permissions:
      # Read access to this repository's release assets, which
      # //bazel:gh_release.bzl downloads with the `gh` CLI.
      contents: read
    env:
      # `gh release download` runs inside a Bazel repository rule and inherits
      # the environment of the Bazel client. intrinsic-omts is private, so
      # without a token `gh` reports "release not found" for every asset.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Compiled outputs, cached between runs by actions/cache.
      BAZEL_DISK_CACHE: /home/runner/.cache/bazel-disk
    steps:
      - name: Checkout OMTS
        uses: actions/checkout@v7

      # Analyzing //... materialises a ~33 GB Bazel output base: the LLVM
      # toolchain alone is 8.2 GB and the tritonserver OCI image another 8.0 GB.
      # A stock ubuntu-24.04 runner only has ~25 GB free, so reclaim everything
      # this job does not use (~35 GB). Bazel supplies its own hermetic Python,
      # Go, Rust and C++ toolchains, so the preinstalled ones are dead weight.
      #
      # Note that the runner also exports ANDROID_HOME and ANDROID_SDK_ROOT.
      # Bazel's android_sdk_repository picks those up and fails with "No
      # Android SDK apis found" once the SDK is gone, so the Bazel steps below
      # unset them.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/lib/google-cloud-sdk \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/miniconda \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      # The runner ships bazelisk as an npm package under
      # /usr/local/lib/node_modules, which the step above deletes. Install it
      # directly so this job does not depend on how the image packages it.
      #
      # /usr/local/bin/bazel is a symlink into that deleted npm tree, so it is
      # dangling at this point. Writing through it fails ("curl: (23) Failure
      # writing output to destination"), hence the explicit rm.
      - name: Install Bazelisk
        run: |
          BAZELISK_URL="https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64"
          sudo rm -f /usr/local/bin/bazel /usr/local/bin/bazelisk
          sudo curl -sSL "${BAZELISK_URL}" -o /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      # intrinsic-ai/ioc-staging is private and the default GITHUB_TOKEN is
      # scoped to this repository only. IOC_STAGING_DEPLOY_KEY is the private
      # half of a read-only deploy key registered on ioc-staging, so the
      # credential is scoped to that one repository. Once ioc-staging is public
      # this step, the secret and the deploy key can all be deleted.
      - name: Configure access to ioc-staging
        env:
          IOC_STAGING_DEPLOY_KEY: ${{ secrets.IOC_STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "${IOC_STAGING_DEPLOY_KEY}" ]; then
            echo "::error::IOC_STAGING_DEPLOY_KEY secret is not configured."
            echo "It is the private half of the read-only deploy key on" \
              "intrinsic-ai/ioc-staging."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${IOC_STAGING_DEPLOY_KEY}" > ~/.ssh/ioc_staging
          chmod 600 ~/.ssh/ioc_staging
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Configured in ~/.ssh/config rather than core.sshCommand so that
          # git-lfs, which invokes ssh itself, also picks the key up.
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/ioc_staging"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
          # MODULE.bazel clones ioc-staging over https, but a deploy key only
          # authenticates over ssh. Rewrite just that one URL so the rest of
          # github.com, including actions/checkout's own credentials, is
          # untouched.
          git config --global \
            url."git@github.com:intrinsic-ai/ioc-staging.git".insteadOf \
            "https://github.com/intrinsic-ai/ioc-staging.git"
          # IOC keeps its binary assets in Git LFS. Bazel checks the repository
          # out with plain `git`, so the LFS smudge filter has to be installed
          # globally or the working tree ends up full of pointer files.
          git lfs install --skip-repo
          git lfs version

      # actions/cache only writes on a fully green job, which means a run that
      # fails in `Run unit tests` would throw away everything it compiled.
      # Restore and save are therefore separate steps.
      #
      # Caches are only written from main: a cache created on a PR branch is
      # visible to that PR alone, but still counts against the repository's
      # 10 GB quota and evicts the entry every other branch reads from.
      #
      # Only the disk cache (compiled outputs) is cached. Bazel's repository
      # cache is deliberately left out: fetching //... pulls ~13 GB of archives
      # (LLVM, CUDA, TensorRT, the FoundationPose weights), which does not fit
      # in the 10 GB quota and would evict everything else. Those archives are
      # served by the mirror configured in .bazelrc
      # (bazel/content_mirror/permissive.cfg) instead.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      # Analysis catches the class of breakage this job exists for: stale @ioc
      # labels, missing dependencies and malformed BUILD files. It covers all
      # of //..., which a full compile cannot on a GitHub-hosted runner (ICON,
      # OpenCV, CUDA and the FoundationPose models do not fit).
      #
      # --keep_going reports every broken label in one run instead of aborting
      # on the first one.
      #
      # An empty --repository_cache disables the repository cache. It is pure
      # overhead here: it would hold a second, 13 GB copy of archives that are
      # only ever fetched once per run, and the runner does not have room for
      # both that and the 33 GB they extract into.
      - name: Analyze all targets
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME \
            ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          bazel \
            build --nobuild \
            --keep_going \
            --repository_cache= \
            //...
          df -h /

      - name: Run unit tests
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME \
            ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          bazel \
            test \
            --repository_cache= \
            --disk_cache="${BAZEL_DISK_CACHE}" \
            --test_output=errors \
            //tests/...
          df -h /

      # A full cold `bazel test //tests/...` produces about 350 MB of cached
      # outputs, so no pruning is needed to stay inside the 10 GB quota. This
      # step exists to notice if that ever stops being true.
      - name: Report Bazel disk cache size
        if: always()
        run: du -sh "${BAZEL_DISK_CACHE}" || true

      - name: Save Bazel disk cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}

